# Five-token OneSearch-style diagnostic.  This is representation-only in the
# first round; the four-token control above is trained first for a strict
# same-length comparison with OPQ4.
n_digit: 5
quantizer_n_digit: 5
codebook_size: 256
sid_quantizer: rq_opq
rq_opq_rq_digits: 3
rq_opq_opq_digits: 2
rq_opq_seed: 2026
rq_opq_niters: 25
rq_opq_normalize_residual: false
rq_opq_repair_opq_digit: 1
sid_collision_strategy: hungarian
force_regenerate_opq: false

