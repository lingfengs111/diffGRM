# Latte-matched Scientific23 protocol.  The external SID file must be produced
# by scripts/encode_latte_metadata.py + scripts/generate_latte_rqkmeans_sids.py.
category: Industrial_and_Scientific
data_dir: /home/lingfengs111/codes/GR/CleanGR/outputs/amazon23_science/raw_core5
splits_dir: splits_l20
expected_protocol:
  train: 259992
  val: 50985
  test: 50985
  items: 25848

max_history_len: 20
max_hist_len: 20

# Latte/PSID tokenizer: Sentence-T5-base, PCA-192 whitening, RQ-KMeans 3x256,
# followed by embedding-space semantic mapping (ESM) collision repair.
n_digit: 4
quantizer_n_digit: 3
codebook_size: 256
sid_quantizer: rq_kmeans
sid_collision_strategy: none
sent_emb_model: sentence-transformers/sentence-t5-base
sent_emb_dim: 768
sent_emb_pca: 192
normalize_after_pca: false
sid_override_path: /home/lingfengs111/codes/GR_variant/DiffGRM/cache/AmazonReviews2023CleanGR/Industrial_and_Scientific/processed/sentence-t5-base_latte-meta_pca192_RQKMEANS3x256_psid.sem_ids
sid_override_tag: latte-meta-rqkmeans3x256-psid

# Latte's eight alternative generation paths.  Coordinate zero is not item
# identity; validation and test collapse the paths by item using agg_max.
sid_prefix_strategy: random_latent
n_latent_tokens: 8
item_identity_start_digit: 1
latent_item_aggregation: max
item_path_aggregation: max

# Long enough to avoid the short-cap ambiguity in earlier transfers.
epochs: 180
eval_start_epoch: 10
eval_interval: 2
patience: 18
early_stopping_min_delta: 0.0
topk: [5, 10]
metrics: [ndcg, recall]

