use_causal_mask: true
teacher_forcing: true
constrained_beam: true

# A bounded exploratory run; the original OPQ AR checkpoint selected epoch 32.
epochs: 50
eval_start_epoch: 12
eval_interval: 2
patience: 8

ar_beam_search:
  top_k_final: 10
  self_kv_cache: true
  cross_kv_cache: true
  seed: 42
  val:
    pre_cut_num: [32, 32, 32, 32, 32]
    beam_search_num: [32, 32, 32, 32, 32]
  test:
    pre_cut_num: [128, 128, 128, 128, 128]
    beam_search_num: [128, 128, 128, 128, 128]

